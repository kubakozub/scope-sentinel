[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-sentinel"
version = "1.0.0"
description = "Confirm whether a target is in scope for a bug-bounty program before you test it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jakub Kozub" }]
keywords = [
    "bug-bounty",
    "security",
    "scope",
    "responsible-disclosure",
    "penetration-testing",
    "hackerone",
    "bugcrowd",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
scope-sentinel = "scope_sentinel.cli:main"

[tool.setuptools]
packages = ["scope_sentinel"]
